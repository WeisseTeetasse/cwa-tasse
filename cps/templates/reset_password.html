{% extends "layout.html" %}
{% block body %}
<div style="background-color: rgba(0, 0, 0, .4);
    border: none;
    padding-bottom: 4rem;
    margin: 0;
    display: flex;
    margin-top: 8rem;
    height: fit-content;
    flex-direction: column;
    justify-content: center;" class="well col-sm-6 col-sm-offset-2">
  <h2 style="margin-top: 0">{{_('Set a new password')}}</h2>
  <form method="POST" role="form" style="background: none;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="password" style="color: var(--color-primary)">{{_('New password')}}</label>
      <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required>
    </div>
    <div class="form-group">
      <label for="password_confirm" style="color: var(--color-primary)">{{_('Confirm new password')}}</label>
      <input type="password" class="form-control" id="password_confirm" name="password_confirm" autocomplete="new-password" required>
    </div>
    <div class="checkbox">
      <label>
        <input type="checkbox" onclick="
          var p = document.getElementById('password');
          var c = document.getElementById('password_confirm');
          var t = this.checked ? 'text' : 'password';
          p.type = t; c.type = t;
        "> {{_('Show passwords')}}
      </label>
    </div>
    <button type="submit" class="btn btn-default">{{_('Update password')}}</button>
    <a class="btn btn-default" href="{{ url_for('web.login') }}">{{_('Cancel')}}</a>
  </form>
</div>
{% endblock %}
